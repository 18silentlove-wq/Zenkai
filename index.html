<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08080b">
<title>ZENKAI | Anime Universe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap');
:root{--red:#ff1838;--dark:#08080b}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:var(--dark);color:#fff;font-family:Inter,sans-serif;display:flex;flex-direction:column}
header{padding:22px 6%;border-bottom:1px solid #ffffff14;background:#09090df2}
.logo{font:900 26px Orbitron,sans-serif;letter-spacing:3px}.logo span{color:var(--red)}
main{flex:1;display:grid;place-items:center;padding:40px 20px;text-align:center}
.content{max-width:620px}
.eyebrow{color:var(--red);font-size:11px;font-weight:800;letter-spacing:4px;margin-bottom:18px}
h1{font:700 clamp(28px,7vw,48px) Orbitron,sans-serif;margin-bottom:18px}
p{color:#a2a2ad;font-size:14px;line-height:1.8}
.line{width:65px;height:3px;background:var(--red);margin:25px auto;border-radius:4px}
footer{border-top:1px solid #ffffff14;text-align:center;padding:22px;color:#777;font-size:10px;letter-spacing:2px}
footer strong{color:var(--red);font-family:Orbitron,sans-serif}
</style>
</head>
<body>
<header><div class="logo">ZEN<span>KAI</span></div></header>
<main>
 <section class="content">
  <div class="eyebrow">ANIME UNIVERSE</div>
  <h1>ZENKAI</h1>
  <div class="line"></div>
  <p>Anime listings have been removed for now. The ZENKAI project is being redesigned.</p>
 </section>
</main>
<footer><strong>ZENKAI</strong><br><br>ANIME DISCOVERY · © 2026</footer>
</body>
</html>
